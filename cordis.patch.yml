# Bundle patch layer: the row loads the package's main entry as the host half
# (local vault writer + git sync + the brain_save / brain_search tools), and
# `dsh.client` loads ./client.js as the browser half, which contributes the
# sidebar entry and the writing page. `config` is the single source of truth for
# the vault location, shared by the page and the tools.
- insert:
    - id: brain
      name: '@local/brain'
      config:
        # Set these in the panel's settings (or here) to your own vault.
        owner: ''
        repo: ''
        branch: main
        inbox: inbox
        siteUrl: ''
        vaultPath: ~/brain
