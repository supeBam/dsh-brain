# Bundle patch layer: the row loads the package's main entry as the host half
# (GitHub proxy + the brain_save / brain_search tools), and `dsh.client` loads
# ./client.js as the browser half, which contributes the sidebar entry and the
# writing page. `config` is the single source of truth for the vault location,
# shared by the page and the tools.
- insert:
    - id: brain
      name: '@local/brain'
      config:
        owner: supeBam
        repo: brain
        branch: main
        inbox: inbox
        siteUrl: ''
